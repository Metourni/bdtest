<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12081f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="Happy Birthday Cleopatra, Queen of the East." />
  <title>Happy Birthday</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #fff6e4;
  --gold: #f0c14b;
  --gold-deep: #c99220;
  --teal: #3ec7c2;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #12081f;
  color: var(--ink);
  font-family: "Cormorant Garamond", Georgia, serif;
  overflow: hidden;
}

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
}

.veil {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, transparent 0%, rgba(12, 6, 24, 0.25) 55%, rgba(12, 6, 24, 0.72) 100%),
    linear-gradient(180deg, rgba(18, 8, 31, 0.45), transparent 22%, transparent 70%, rgba(18, 8, 31, 0.55));
}

.stage {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  padding: calc(env(safe-area-inset-top) + 1.5rem) 1.25rem calc(env(safe-area-inset-bottom) + 1.5rem);
  text-align: center;
  pointer-events: none;
}

.card {
  width: min(100%, 28rem);
  transform: translateY(18px) scale(0.98);
  opacity: 0;
  animation: riseIn 1.2s var(--ease) 0.25s forwards;
}

.ornament {
  width: min(100%, 14rem);
  height: 14px;
  margin: 0 auto 1.1rem;
  background:
    linear-gradient(90deg, transparent, var(--gold), transparent);
  clip-path: polygon(0 50%, 8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%);
  opacity: 0.9;
}

.kicker {
  margin: 0 0 0.55rem;
  font-family: "Cinzel", serif;
  font-size: 0.7rem;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--teal);
  text-shadow: 0 0 18px rgba(62, 199, 194, 0.35);
}

h1 {
  margin: 0;
  font-family: "Cinzel", serif;
  font-weight: 700;
  font-size: clamp(2.4rem, 10vw, 3.8rem);
  line-height: 1.05;
  letter-spacing: 0.04em;
  text-wrap: balance;
  background: linear-gradient(180deg, #fff8e6 0%, #f0c14b 48%, #a87418 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.45));
}

.name {
  margin: 0.85rem 0 0;
  font-family: "Cinzel", serif;
  font-size: clamp(1.35rem, 5.5vw, 1.9rem);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--ink);
  text-shadow: 0 0 24px rgba(240, 193, 75, 0.25);
}

.line {
  margin: 0.7rem auto 0;
  max-width: 22ch;
  font-size: clamp(1.25rem, 4.6vw, 1.65rem);
  font-style: italic;
  color: rgba(255, 246, 228, 0.78);
  line-height: 1.35;
}

.spark {
  pointer-events: auto;
  margin-top: 1.4rem;
  min-height: 2.75rem;
  padding: 0.7rem 1.2rem;
  border: 1px solid rgba(240, 193, 75, 0.55);
  background: linear-gradient(180deg, rgba(240, 193, 75, 0.95), rgba(170, 110, 20, 0.95));
  color: #1a1004;
  font-family: "Cinzel", serif;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.35s var(--ease), filter 0.3s ease;
  -webkit-tap-highlight-color: transparent;
}
.spark:active { transform: scale(0.97); }

@keyframes riseIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; opacity: 1; transform: none; }
}
  </style>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <main class="stage">
    <div class="card">
      <div class="ornament" aria-hidden="true"></div>
      <p class="kicker">Nile night</p>
      <h1>Happy Birthday</h1>
      <p class="name" id="who">Love</p>
      <p class="line" id="title">Cleopatra, Queen of the East</p>
      <button type="button" class="spark" id="sparkBtn">Gold dust</button>
    </div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from "three";

const params = new URLSearchParams(location.search);
const name = (params.get("name") || "Love").trim() || "Love";
const title =
  (params.get("title") || "").trim() ||
  "Cleopatra, Queen of the East";

document.title = "Happy Birthday, " + name;
document.getElementById("who").textContent = name;
document.getElementById("title").textContent = title;

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("world");
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: !reduce,
  powerPreference: "high-performance",
});
renderer.setPixelRatio(Math.min(devicePixelRatio, reduce ? 1 : 1.85));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x140a24, 0.016);

// Slot-game sky: deep purple → teal horizon
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      top: { value: new THREE.Color(0x1a0a38) },
      mid: { value: new THREE.Color(0x3a1560) },
      bot: { value: new THREE.Color(0x1a4a55) },
    },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 top;
      uniform vec3 mid;
      uniform vec3 bot;
      varying vec3 vPos;
      void main() {
        float h = normalize(vPos).y;
        vec3 col = mix(bot, mid, smoothstep(-0.2, 0.25, h));
        col = mix(col, top, smoothstep(0.2, 0.85, h));
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
scene.add(sky);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 7.5, 26);

scene.add(new THREE.HemisphereLight(0x9aa7ff, 0x4a2a10, 0.55));
const key = new THREE.DirectionalLight(0xffd89a, 1.35);
key.position.set(-12, 22, 8);
scene.add(key);
const rim = new THREE.PointLight(0x3ec7c2, 1.6, 70);
rim.position.set(10, 8, 6);
scene.add(rim);
const goldLight = new THREE.PointLight(0xf0c14b, 2.2, 55);
goldLight.position.set(0, 9, 2);
scene.add(goldLight);

// Stars
{
  const n = reduce ? 500 : 1600;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 60 + Math.random() * 110;
    const t = Math.random() * Math.PI * 2;
    const p = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(p) * Math.cos(t);
    pos[i * 3 + 1] = Math.abs(r * Math.cos(p)) + 8;
    pos[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(
    new THREE.Points(
      g,
      new THREE.PointsMaterial({
        color: 0xfff1c4,
        size: 0.28,
        transparent: true,
        opacity: 0.9,
        depthWrite: false,
      })
    )
  );
}

function goldMat(hex = 0xe0b14a) {
  return new THREE.MeshStandardMaterial({
    color: hex,
    metalness: 0.92,
    roughness: 0.28,
    emissive: 0x4a3208,
    emissiveIntensity: 0.25,
  });
}

function stoneMat(hex = 0xb8924a) {
  return new THREE.MeshStandardMaterial({
    color: hex,
    roughness: 0.78,
    metalness: 0.18,
    flatShading: true,
  });
}

function pyramid(size, color) {
  const geo = new THREE.ConeGeometry(size, size * 1.2, 4);
  geo.rotateY(Math.PI / 4);
  return new THREE.Mesh(geo, stoneMat(color));
}

const world = new THREE.Group();
scene.add(world);

const sand = new THREE.Mesh(
  new THREE.CircleGeometry(140, 72),
  new THREE.MeshStandardMaterial({ color: 0x9a6f3a, roughness: 1, metalness: 0.05 })
);
sand.rotation.x = -Math.PI / 2;
world.add(sand);

for (let i = 0; i < 8; i++) {
  const dune = new THREE.Mesh(
    new THREE.SphereGeometry(10 + Math.random() * 8, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0xa87a42, roughness: 1, flatShading: true })
  );
  dune.position.set((Math.random() - 0.5) * 80, -2, -25 - Math.random() * 50);
  dune.scale.set(1.8, 0.32, 1.3);
  world.add(dune);
}

const p1 = pyramid(11, 0xd4a84e);
p1.position.set(0, 6.6, -10);
const p2 = pyramid(7, 0xc49640);
p2.position.set(-13, 4.2, -20);
const p3 = pyramid(5.5, 0xb48438);
p3.position.set(12, 3.3, -24);
world.add(p1, p2, p3);

// Gold pyramid caps (slot-game shine)
;[p1, p2, p3].forEach((p, i) => {
  const cap = new THREE.Mesh(
    new THREE.ConeGeometry(0.9 - i * 0.15, 1.2 - i * 0.15, 4),
    goldMat(0xf2c85a)
  );
  cap.rotation.y = Math.PI / 4;
  cap.position.y = p.geometry.parameters.height / 2 - 0.2;
  p.add(cap);
});

// Temple pillars
function pillar(x, z) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.7, 8, 10),
    goldMat(0xd7a63f)
  );
  shaft.position.y = 4;
  const band = new THREE.Mesh(
    new THREE.TorusGeometry(0.78, 0.12, 8, 24),
    new THREE.MeshStandardMaterial({
      color: 0x2ec4b6,
      metalness: 0.7,
      roughness: 0.35,
      emissive: 0x0a4a45,
      emissiveIntensity: 0.5,
    })
  );
  band.rotation.x = Math.PI / 2;
  band.position.y = 5.5;
  const top = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.35, 2.1), goldMat(0xe8bc55));
  top.position.y = 8.1;
  g.add(shaft, band, top);
  g.position.set(x, 0, z);
  return g;
}
world.add(pillar(-8, 4), pillar(8, 4), pillar(-11, -2), pillar(11, -2));

// Moon
const moonTex = new THREE.TextureLoader().load("assets/moon.jpg");
moonTex.colorSpace = THREE.SRGBColorSpace;
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(3.4, 48, 48),
  new THREE.MeshStandardMaterial({
    map: moonTex,
    emissive: 0x665533,
    emissiveIntensity: 0.4,
    roughness: 1,
  })
);
moon.position.set(-10, 20, -28);
scene.add(moon);
moon.add(new THREE.PointLight(0xfff0c8, 1.6, 70));

// Eye of Horus / sun disk above center pyramid
const disk = new THREE.Mesh(
  new THREE.CircleGeometry(1.6, 48),
  new THREE.MeshStandardMaterial({
    color: 0xffd56a,
    emissive: 0xf0a020,
    emissiveIntensity: 1.2,
    metalness: 0.6,
    roughness: 0.3,
    side: THREE.DoubleSide,
  })
);
disk.position.set(0, 15.5, -10);
scene.add(disk);
const diskRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.05, 0.08, 8, 48),
  goldMat(0xffe08a)
);
diskRing.position.copy(disk.position);
scene.add(diskRing);

// Floating scarab / jewel particles
const jewels = [];
const jewelGeo = new THREE.OctahedronGeometry(0.28, 0);
const jewelMat = goldMat(0xffd56a);
for (let i = 0; i < (reduce ? 10 : 22); i++) {
  const m = new THREE.Mesh(jewelGeo, jewelMat);
  const d = {
    mesh: m,
    x: (Math.random() - 0.5) * 28,
    y: 2 + Math.random() * 9,
    z: (Math.random() - 0.5) * 22,
    ph: Math.random() * Math.PI * 2,
    sp: 0.5 + Math.random(),
  };
  m.position.set(d.x, d.y, d.z);
  m.scale.setScalar(0.7 + Math.random());
  scene.add(m);
  jewels.push(d);
}

// Hieroglyph cards
function glyphTex(sym) {
  const c = document.createElement("canvas");
  c.width = 128;
  c.height = 128;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "rgba(240,193,75,0.92)";
  ctx.font = "70px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(sym, 64, 70);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glyphs = new THREE.Group();
scene.add(glyphs);
["𓂀", "𓆣", "𓇳", "𓋹", "𓃭", "𓁰"].forEach((s, i) => {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(1.8, 1.8),
    new THREE.MeshBasicMaterial({
      map: glyphTex(s),
      transparent: true,
      opacity: 0.65,
      depthWrite: false,
      side: THREE.DoubleSide,
    })
  );
  const a = (i / 6) * Math.PI * 2;
  m.position.set(Math.cos(a) * 14, 5 + (i % 2), Math.sin(a) * 12 - 4);
  glyphs.add(m);
});

// Nile ribbon with teal glow
const nile = new THREE.Mesh(
  new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3([
      new THREE.Vector3(-42, 0.12, 22),
      new THREE.Vector3(-12, 0.12, 10),
      new THREE.Vector3(2, 0.12, 5),
      new THREE.Vector3(16, 0.12, 12),
      new THREE.Vector3(42, 0.12, 24),
    ]),
    100,
    2.2,
    12,
    false
  ),
  new THREE.MeshStandardMaterial({
    color: 0x1f7f88,
    emissive: 0x0c3d48,
    emissiveIntensity: 0.55,
    metalness: 0.4,
    roughness: 0.22,
    transparent: true,
    opacity: 0.92,
  })
);
world.add(nile);

// Burst sparks
const sparks = [];
const sparkGeo = new THREE.SphereGeometry(0.1, 8, 8);
const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffe7a8 });
function burst() {
  const origin = new THREE.Vector3(0, 6, 4);
  for (let i = 0; i < 36; i++) {
    const m = new THREE.Mesh(sparkGeo, sparkMat);
    m.position.copy(origin);
    scene.add(m);
    sparks.push({
      mesh: m,
      v: new THREE.Vector3(
        (Math.random() - 0.5) * 0.5,
        Math.random() * 0.4 + 0.12,
        (Math.random() - 0.5) * 0.5
      ),
      life: 1,
    });
  }
}
document.getElementById("sparkBtn").addEventListener("click", burst);

// Pointer / touch parallax
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
function onPointer(e) {
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  pointer.tx = (x / innerWidth) * 2 - 1;
  pointer.ty = (y / innerHeight) * 2 - 1;
}
addEventListener("pointermove", onPointer, { passive: true });
addEventListener("touchmove", onPointer, { passive: true });

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, reduce ? 1 : 1.85));
}
addEventListener("resize", resize, { passive: true });

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  pointer.x += (pointer.tx - pointer.x) * 0.04;
  pointer.y += (pointer.ty - pointer.y) * 0.04;

  const orbit = t * (reduce ? 0.02 : 0.045);
  const radius = 24;
  camera.position.x = Math.sin(orbit) * radius * 0.35 + pointer.x * 2.2;
  camera.position.y = 7.2 + Math.sin(t * 0.35) * 0.45 - pointer.y * 1.2;
  camera.position.z = 22 + Math.cos(orbit) * 4;
  camera.lookAt(0, 5.5, -8);

  moon.rotation.y = t * 0.04;
  disk.rotation.z = t * 0.15;
  diskRing.rotation.z = -t * 0.2;
  disk.material.emissiveIntensity = 1.05 + Math.sin(t * 2) * 0.25;
  goldLight.intensity = 1.8 + Math.sin(t * 1.4) * 0.4;
  rim.intensity = 1.3 + Math.sin(t * 1.1 + 1) * 0.35;

  glyphs.rotation.y = t * 0.07;
  glyphs.children.forEach((g, i) => {
    g.position.y = 5 + (i % 2) + Math.sin(t * 0.9 + i) * 0.55;
    g.quaternion.copy(camera.quaternion);
  });

  jewels.forEach((j) => {
    j.mesh.position.y = j.y + Math.sin(t * j.sp + j.ph) * 0.75;
    j.mesh.rotation.x = t * 0.7 + j.ph;
    j.mesh.rotation.y = t * 0.5 + j.ph;
  });

  p1.rotation.y = Math.sin(t * 0.12) * 0.04;

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt * 0.85;
    s.v.y -= dt * 0.35;
    s.mesh.position.addScaledVector(s.v, 55 * dt);
    s.mesh.scale.setScalar(Math.max(s.life, 0.01));
    if (s.life <= 0) {
      scene.remove(s.mesh);
      sparks.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
  </script>
</body>
</html>
